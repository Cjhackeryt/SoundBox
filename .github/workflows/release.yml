name: Build and release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore dependencies
        run: dotnet restore SoundBox.csproj -r win-x64

      - name: Build
        run: dotnet build SoundBox.csproj -c Release --no-restore

      - name: Publish plugin
        run: dotnet publish SoundBox.csproj -c Release -r win-x64 --self-contained true --no-restore -o artifacts\plugin\runtimes\win-x64

      - name: Assemble Macro Deck plugin package
        shell: pwsh
        run: |
          Remove-Item artifacts\plugin\runtimes\win-x64\manifest.json -Force -ErrorAction SilentlyContinue
          Remove-Item artifacts\plugin\runtimes\win-x64\macrodeck-build.json -Force -ErrorAction SilentlyContinue
          Remove-Item artifacts\plugin\runtimes\win-x64\Assets -Recurse -Force -ErrorAction SilentlyContinue
          Copy-Item manifest.json artifacts\plugin\manifest.json -Force
          Copy-Item macrodeck-build.json artifacts\plugin\macrodeck-build.json -Force
          New-Item -ItemType Directory -Path artifacts\plugin\Assets -Force | Out-Null
          Copy-Item Assets\icon.svg artifacts\plugin\Assets\icon.svg -Force
          Compress-Archive -Path artifacts\plugin\* -DestinationPath SoundBox-${{ github.ref_name }}.zip
          Move-Item SoundBox-${{ github.ref_name }}.zip SoundBox-${{ github.ref_name }}.macroDeckPlugin -Force

      - name: Upload package to GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.ref_name }}" "SoundBox-${{ github.ref_name }}.macroDeckPlugin" --clobber
