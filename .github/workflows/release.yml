# Publishing a GitHub release builds the plugin with its release tag and uploads
# the resulting package to the Macro Deck Platform.

name: Release

on:
  release:
    types: [published]

jobs:
  publish:
    uses: Macro-Deck-App/GitHub-Actions/.github/workflows/publish-plugin.yml@v1
    permissions:
      contents: read
      id-token: write
    with:
      version: ${{ github.event.release.tag_name }}
      source: .
      cli-version: 3.0.0-beta.11
      changelog: ${{ github.event.release.body }}
